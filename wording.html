<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wording Editor</title>
<script src="ets-config.js"></script>
<script src="workspace.js"></script>
<script src="editor-common.js"></script>
<script>Workspace.block('The wording is shared by the whole site, not by one event. Go back to the live site to edit it.');</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:#222}
body{display:flex;flex-direction:column}
header{background:#333;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:17px;margin:0 8px 0 0}
button{font:inherit;font-size:13px;padding:7px 11px;border:0;border-radius:4px;background:#fff;color:#222;cursor:pointer}
button:hover{background:#eee}
button.go{background:#28a745;color:#fff;font-weight:bold}
button.go:hover{background:#218838}
button.danger{color:#b3261e}
button:disabled{opacity:.4;cursor:not-allowed}
#status{background:#fff3cd;color:#664d03;padding:6px 12px;font-size:13px;border-bottom:1px solid #e6d9a2}
#status:empty{display:none}
main{flex:1;overflow:auto;padding:14px 18px 60px}
.wrap{max-width:820px;margin:0 auto}
.lead{font-size:14px;line-height:1.5;color:#444;margin:0 0 12px}
details{border:1px solid #ddd;border-radius:8px;margin:10px 0;background:#fff}
summary{cursor:pointer;padding:10px 14px;font-weight:bold;font-size:15px;background:#f4f4f4;border-radius:8px}
details[open] summary{border-bottom:1px solid #ddd;border-radius:8px 8px 0 0}
.row{padding:10px 14px;border-bottom:1px solid #eee}
.row:last-child{border-bottom:0}
.row label{display:block;font-size:13px;font-weight:bold;margin-bottom:4px}
.row input[type=text]{width:100%;padding:7px;font:inherit;font-size:14px;border:1px solid #bbb;border-radius:4px}
.row input[type=text].changed{border-color:#0072B2;background:#f2f8fd}
.row .meta{font-size:12px;color:#666;margin-top:4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .meta button{padding:2px 8px;font-size:12px;background:#e7e7e7}
.row .warn{color:#b3261e;font-size:12px;margin-top:3px}
.row .prev{font-size:12px;margin-top:4px;color:#145}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid #bbb;border-radius:999px;padding:5px 12px;font-size:13px;background:#fff}
.crow{display:flex;gap:6px;align-items:center;margin:4px 0}
.crow input[type=number]{width:90px;padding:6px;border:1px solid #bbb;border-radius:4px;font:inherit}
.crow input[type=text]{flex:1}
.crow button{padding:5px 9px;background:#e7e7e7}
.hint{font-size:12px;color:#666}
</style>
</head>
<body>
<header>
  <h1>Wording</h1>
  <button id="resetAll" type="button" class="danger">Reset everything to the standard wording</button>
  <span style="flex:1"></span>
  <button id="dlBtn" type="button" class="go" disabled>Download Updated labels.csv</button>
</header>
<div id="status"></div>
<main><div class="wrap" id="root"></div></main>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/dist/papaparse.min.js"></script>
<script src="labels.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SAMPLE = { end: "Sat, Nov 14 at 5 PM", start: "Sat, Nov 21 at 11 AM" };
let over = {}, loaded = false;

async function init() {
  if (!window.Papa) { $("status").textContent = "The page could not load its spreadsheet reader. Check your internet connection and reload."; return; }
  over = await Labels.load();
  Object.keys(over).forEach(k => { if (!Labels.DEF[k]) delete over[k]; });
  loaded = true; build();
  $("status").textContent = Object.keys(over).length ? "" : "Everything is on the standard wording. Change any phrase below.";
}

const std = k => Labels.DEF[k].text;
const cur = k => (over[k] != null && over[k] !== "") ? over[k] : "";
function markEdited() { $("dlBtn").disabled = false; const e = document.createEvent("Event"); e.initEvent("input", true, true); document.body.dispatchEvent(e); }

function build() {
  const groups = [];
  Labels.LIST.forEach(r => { if (!groups.includes(r[1])) groups.push(r[1]); });
  $("root").innerHTML = '<p class="lead">These are the words visitors read that the site makes up itself. Change any of them. Leave a box empty to use the standard wording. Your own text for places, tours and announcements is edited in their own tabs.</p>' +
    groups.map((g, gi) => '<details' + (gi < 2 ? " open" : "") + "><summary>" + esc(g) + "</summary>" +
      Labels.LIST.filter(r => r[1] === g).map(r => r[5] === "special" ? chipsRow() : textRow(r)).join("") + "</details>").join("");
  bind();
}
function textRow(r) {
  const k = r[0], d = Labels.DEF[k];
  return '<div class="row" data-k="' + esc(k) + '"><label for="w_' + esc(k) + '">' + esc(d.title) + '</label>' +
    '<input type="text" id="w_' + esc(k) + '" value="' + esc(cur(k)) + '" placeholder="' + esc(d.text) + '" class="' + (cur(k) ? "changed" : "") + '">' +
    '<div class="meta"><span>Standard: ' + esc(d.text) + '</span><button type="button" class="rs" ' + (cur(k) ? "" : "hidden") + '>Use the standard</button></div>' +
    (d.help ? '<div class="hint">' + esc(d.help) + "</div>" : "") + '<div class="warn"></div>' + (k.indexOf("status.") === 0 ? '<div class="prev"></div>' : "") + "</div>";
}
function chipsRow() {
  return '<div class="row" data-k="tours.chips"><label>Time buttons</label><div class="hint">The buttons visitors press to say how much time they have. Each shows the words you type and hides tours that take longer. Use the arrows to change their order.</div>' +
    '<div id="chipRows"></div><div class="meta"><button type="button" id="addChip">+ Add a time button</button><button type="button" id="rsChips">Use the standard buttons</button></div><div class="chips" id="chipPrev"></div></div>';
}

/* ---------- the ordinary phrases ---------- */
function bind() {
  document.querySelectorAll(".row[data-k]").forEach(row => {
    const k = row.dataset.k; if (k === "tours.chips") return;
    const inp = row.querySelector("input[type=text]"), rs = row.querySelector(".rs"), warn = row.querySelector(".warn"), prev = row.querySelector(".prev");
    const paint = () => {
      const v = inp.value.trim(), need = (Labels.DEF[k].text.match(/\{\w+\}/g) || []);
      inp.classList.toggle("changed", !!v); rs.hidden = !v;
      warn.textContent = v && need.some(n => v.indexOf(n) < 0) ? "Keep " + need.join(" and ") + " in the phrase, or the day and time will not appear." : "";
      if (prev) prev.textContent = "Visitors will read: " + Labels.fill(v || std(k), SAMPLE);
    };
    inp.addEventListener("input", () => { const v = inp.value; if (v.trim() === "" || v.trim() === std(k)) delete over[k]; else over[k] = v; paint(); markEdited(); });
    rs.onclick = () => { inp.value = ""; delete over[k]; paint(); markEdited(); };
    paint();
  });
  renderChips();
  $("addChip").onclick = () => { const c = chipList(); if (c.length >= 8) return; c.push({ minutes: (c.length ? c[c.length - 1].minutes : 0) + 30, label: "New button" }); saveChips(c); renderChips(); markEdited(); };
  $("rsChips").onclick = () => { delete over["tours.chips"]; renderChips(); markEdited(); };
}

/* ---------- the time buttons ---------- */
function chipList() { Labels.set(over); return Labels.chips().map(c => ({ minutes: c.minutes, label: c.label })); }
function saveChips(list) {
  const s = list.filter(c => c.minutes > 0 && String(c.label).trim()).map(c => c.minutes + "=" + String(c.label).replace(/[|=]/g, " ").trim()).join("|");
  if (!s || s === std("tours.chips")) delete over["tours.chips"]; else over["tours.chips"] = s;
}
function renderChips() {
  const list = chipList();
  $("chipRows").innerHTML = list.map((c, i) => '<div class="crow" data-i="' + i + '"><input type="number" class="cm" min="1" value="' + c.minutes + '" aria-label="minutes"> <span class="hint">minutes or less</span>' +
    '<input type="text" class="cl" value="' + esc(c.label) + '" aria-label="words on the button"><button type="button" class="up" ' + (i ? "" : "disabled") + ' aria-label="Move up">\u2191</button><button type="button" class="dn" ' + (i < list.length - 1 ? "" : "disabled") + ' aria-label="Move down">\u2193</button><button type="button" class="rm" aria-label="Remove">\u2715</button></div>').join("");
  $("chipPrev").innerHTML = [Labels.t("tours.chipAny")].concat(list.map(c => c.label)).map(l => '<span class="chip">' + esc(l) + "</span>").join("");
  const sync = () => { const out = [...document.querySelectorAll("#chipRows .crow")].map(r => ({ minutes: Math.round(+r.querySelector(".cm").value) || 0, label: r.querySelector(".cl").value })); return out; };
  document.querySelectorAll("#chipRows .crow").forEach(r => {
    const i = +r.dataset.i;
    const commit = () => { const out = sync(); saveChips(out); $("chipPrev").innerHTML = [Labels.t("tours.chipAny")].concat(out.filter(c => c.minutes > 0 && c.label.trim()).map(c => c.label)).map(l => '<span class="chip">' + esc(l) + "</span>").join(""); markEdited(); };
    r.querySelector(".cm").oninput = commit; r.querySelector(".cl").oninput = commit;
    r.querySelector(".up").onclick = () => { const o = sync(); [o[i - 1], o[i]] = [o[i], o[i - 1]]; saveChips(o); renderChips(); markEdited(); };
    r.querySelector(".dn").onclick = () => { const o = sync(); [o[i + 1], o[i]] = [o[i], o[i + 1]]; saveChips(o); renderChips(); markEdited(); };
    r.querySelector(".rm").onclick = () => { const o = sync(); o.splice(i, 1); if (!o.length) delete over["tours.chips"]; else saveChips(o); renderChips(); markEdited(); };
  });
}

/* ---------- save ---------- */
$("resetAll").onclick = () => { if (!confirm("Go back to the standard wording for everything?")) return; over = {}; build(); markEdited(); };
$("dlBtn").onclick = () => {
  if (!loaded) return;
  const rows = Labels.LIST.filter(r => over[r[0]] != null && over[r[0]] !== "").map(r => ({ KEY: r[0], TEXT: over[r[0]] }));
  const el = document.createElement("a");
  el.href = URL.createObjectURL(new Blob([Papa.unparse(rows, { columns: ["KEY", "TEXT"] })], { type: "text/csv" }));
  el.download = "labels.csv";
  document.body.appendChild(el); el.click(); el.remove();
  $("status").textContent = "Downloaded labels.csv. Upload it to your site next to the map page, replacing the old one. (Or use Publish.)";
};
init();
</script>
<script src="publish.js"></script>
<script>GHPublish.attach({ buttons: ["dlBtn"] });</script>
</body>
</html>
