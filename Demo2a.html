  document.querySelector(".passport-body").insertAdjacentHTML("beforeend", `<div id="pStamps"></div>`);

  const slam = document.getElementById("pSlam");

  let stopConfetti = null;
  function confetti(canvas) {
    const ctx = canvas.getContext("2d");
    const W = canvas.width = innerWidth, H = canvas.height = innerHeight;
    const colors = ["#E47303", "#AF350A", "#91AF45", "#BDD76B", "#FFC20E", "#ffffff"];
    const bits = Array.from({ length: 150 }, () => ({
      x: Math.random() * W, y: -20 - Math.random() * H * 0.6,
      w: 6 + Math.random() * 6, h: 10 + Math.random() * 8,
      vx: -1 + Math.random() * 2, vy: 2 + Math.random() * 3.5,
      r: Math.random() * 6.28, vr: -0.2 + Math.random() * 0.4,
      c: colors[Math.floor(Math.random() * colors.length)]
    }));
    const t0 = performance.now();
    let id = 0;
    (function tick(now) {
      ctx.clearRect(0, 0, W, H);
      bits.forEach(b => {
        b.x += b.vx; b.y += b.vy; b.r += b.vr;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.r);
        ctx.fillStyle = b.c;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      });
      if (now - t0 < 4500) id = requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, W, H);
    })(t0);
    return () => { cancelAnimationFrame(id); ctx.clearRect(0, 0, W, H); };
  }

  let queue = [], showing = false, autoTimer = 0;

  function rewardPriority(job){
    if (job.kind === "grand") return 4;
    if (job.kind === "star" && job.stars >= 3) return 3;
    if (job.kind === "star") return 2;
    return 1;
  }

  function enqueueRewards(jobs){
    if (!jobs.length) return;
    queue.push(...jobs);
    queue.sort((a, b) => rewardPriority(a) - rewardPriority(b));
    pump();
  }

  function allRanksComplete(){
    const active = STAMPS.filter(stampActive);
    return active.length > 0 && active.every(stamp => starsFor(stamp.row, countFor(stamp)) >= 3);
  }

  function pump(){
    if (showing || !queue.length) return;
    if (document.getElementById("welcomeOverlay")) { setTimeout(pump, 500); return; }
    showing = true;
    const job = queue.shift();
    setTimeout(() => render(job), job.replay ? 0 : 600);
  }

  function render(job){
    const { stamp, stars, replay, kind } = job;
    const row = stamp.row;
    const rank = rankFor(row, stars);
    const done = stars >= 3;
    const isStar = kind === "star";
    const isGrand = kind === "grand";
    const taskLabel = job.taskLabel || "";
    slam.classList.toggle("plain", !isStar && !isGrand);

    if (isGrand) {
      slam.querySelector(".box").innerHTML =
        `<div class="seal">${VEHICLE_SVG.train}<b>MASTER HISTORIAN</b></div>` +
        `<div class="rank" id="pRank" aria-live="polite">Every category mastered!</div>` +
        `<div class="grand">Three stars in every active rank</div>` +
        `<div class="note">You've completed the History Passport challenge!</div>` +
        `<div class="tap">TAP TO CONTINUE</div>`;
    } else {
      slam.querySelector(".box").innerHTML =
        `<div class="seal">${VEHICLE_SVG[String(row.VEHICLE||"train").toLowerCase()] || VEHICLE_SVG.train}<b>${esc(row.TITLE||"")}</b></div>` +
        (isStar
          ? `<div class="stars">${starRow(stars, replay ? 0 : stars)}</div>` +
            `<div class="rank" id="pRank" aria-live="polite">${esc(rank)}</div>` +
            (done ? `<div class="grand">${esc(row.GRAND_RANK || "")}</div>` : "")
          : `<div class="rank" style="font-size:20px">${esc(taskLabel || "Task complete!")}</div>`) +
        `<div class="tap">TAP TO CONTINUE</div>`;
    }

    slam.classList.add("on");
    if (isStar || isGrand) slam.classList.add("hit");
    slam.focus();
    if ((isGrand || (isStar && done)) && !REDUCED) {
      stopConfetti = confetti(slam.querySelector("canvas"));
    }
    const duration = isGrand ? 12000 : (isStar && done ? 10000 : (isStar ? 6000 : 2600));
    autoTimer = setTimeout(() => dismiss(replay), duration);
  }

  function dismiss(replay){
    if (!slam.classList.contains("on")) return;
    clearTimeout(autoTimer);
    if (stopConfetti) { stopConfetti(); stopConfetti = null; }
    slam.classList.remove("on", "hit", "plain");
    if (replay !== true) $("passportBtn").classList.add("nudge");
    renderStampCards();
    showing = false;
    pump();
  }

  slam.addEventListener("click", () => dismiss());
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && slam.classList.contains("on")) { dismiss(); e.stopPropagation(); }
  }, true);

  let featuredId = null;

  window.renderStampCards = function(){
    const box = document.getElementById("pStamps");
    if (!box) return;
    if (!STAMPS.length && !TASKS.length){
      box.innerHTML = `<h3 class="p-h">Ranks and tasks</h3><p style="color:#9aa3ad;font-size:13px;margin:0">Loading…</p>`;
      return;
    }
    const active = STAMPS.filter(stampActive);
    const inActive = new Set();
    active.forEach(s => s.tasks.forEach(id => inActive.add(key(id))));
    const loose = TASKS.filter(t => !inActive.has(key(t.row.TASK_ID)));

    let html = "";
    if (active.length){
      if (!featuredId || !active.find(s => key(s.row.STAMP_ID) === key(featuredId))){
        let best = active[0], bestCount = -1;
        active.forEach(s => { const c = countFor(s); if (c > bestCount){ best = s; bestCount = c; } });
        featuredId = best.row.STAMP_ID;
      }
      const featured = active.find(s => key(s.row.STAMP_ID) === key(featuredId));
      const fr = featured.row;
      const fCount = countFor(featured);
      const fStars = starsFor(fr, fCount);
      const fRank = rankFor(fr, fStars);
      const totalTasks = featured.tasks.length;
      const next = [+fr.STAR1 || 0, +fr.STAR2 || 0, +fr.STAR3 || 0].find(t => t > fCount);
      const toGo = next && next <= totalTasks ? next - fCount : 0;
      const featTasks = featured.tasks.map(id => TASKS.find(t => key(t.row.TASK_ID) === key(id))).filter(Boolean);

      html += `
        <h3 class="p-h">Ranks</h3>
        <div class="p-featured" data-id="${esc(fr.STAMP_ID)}">
          <div class="emblem">
            ${VEHICLE_SVG[String(fr.VEHICLE||"train").toLowerCase()] || VEHICLE_SVG.train}
            <b>${esc(fr.TITLE||"")}</b>
          </div>
          <h4>${esc(fr.TITLE||"")}</h4>
          <div class="stars">${starRow(fStars, 0)}</div>
          <div class="rank">${esc(fRank || "Not started yet")}</div>
          <div class="prog">${fCount} of ${totalTasks} tasks done${toGo ? " · " + toGo + " more for the next star" : ""}</div>
          ${fStars >= 3 && fr.GRAND_RANK ? `<div class="grand">${esc(fr.GRAND_RANK)}</div>` : ""}
        </div>
        <div class="p-tiles">
          ${active.map(s => {
            const r = s.row;
            const st = starsFor(r, countFor(s));
            const sel = key(r.STAMP_ID) === key(fr.STAMP_ID);
            return `
              <div class="p-tile ${sel ? "sel" : ""}" data-id="${esc(r.STAMP_ID)}">
                <div class="emblem">${VEHICLE_SVG[String(r.VEHICLE||"train").toLowerCase()] || VEHICLE_SVG.train}</div>
                <div class="name">${esc(r.TITLE||"")}</div>
                <div class="stars">${starRow(st, 0)}</div>
              </div>`;
          }).join("")}
        </div>
        <h4 class="p-tasks-h">Tasks: ${esc(fr.TITLE||"")}</h4>
        ${featTasks.map(taskRowHTML).join("") || `<p class="p-none">No tasks set up for this rank yet.</p>`}`;
    }
    if (loose.length){
      html += `<h4 class="p-tasks-h">${active.length ? "More to do" : "Tasks"}</h4>` + loose.map(taskRowHTML).join("");
    }
    box.innerHTML = html;

    box.querySelectorAll(".p-featured[data-id], .p-tile[data-id]").forEach(el => {
      el.onclick = () => { featuredId = el.dataset.id; renderStampCards(); };
    });
    box.querySelectorAll(".p-task-btn").forEach(btn => {
      btn.onclick = () => {
        const t = TASKS.find(x => key(x.row.TASK_ID) === key(btn.dataset.task));
        if (t) runTaskAction(t);
      };
    });
  };

  $("checkinBtn").onclick = () => {
    const out = $("checkinMsg");
    if (!navigator.geolocation) { out.textContent = "Location isn't available on this device."; return; }
    out.textContent = "Checking where you are…";
    navigator.geolocation.getCurrentPosition(pos => {
      const here = [pos.coords.longitude, pos.coords.latitude];
      const slack = Math.min(pos.coords.accuracy || 0, 50);
      const near = majorSites().filter(s => distM(here, s.ll) <= (parseFloat(s.d.RADIUS) || 75) + slack);
      if (!near.length){ out.textContent = "No passport places are close by. Get a little nearer and try again."; return; }
      const stampable = near.filter(s => ["view", "gps", "either"].includes(stampMode(s.d)));
      if (!stampable.length) { out.textContent = "You're at " + near.map(s => s.name).join(", ") + ". Scan its QR sign to collect the stamp."; return; }
      stampable.forEach(s => {
        earnStamp(s.id, s.d, "gps", s.ll);
        if (window.passportEvent) passportEvent("view", { id: s.id, category: (s.d && s.d.CATEGORY) || null, source: "gps" });
      });
      updatePassportUI();
      out.textContent = "You're at " + stampable.map(s => s.name).join(", ") + "!";
    }, () => { out.textContent = "Couldn't get your location. Check your browser's location permission."; },
    { enableHighAccuracy: true, timeout: 10000 });
  };

  window.passportEvent = (type, context = {}) => {
    if (SITE.passport === false || !TASKS.length) return;
    const wasAllRanksComplete = allRanksComplete();
    const progress = loadProgress();
    progress._done = progress._done || {};
    progress._seen = progress._seen || {};
    const hit = [];
    for (const t of TASKS){
      const id = String(t.row.TASK_ID).trim();
      if (progress._done[id]) continue;
      if (!taskMatches(t.row, type, context)) continue;
      const need = parseInt(t.row.COUNT, 10) || 1;
      if (need > 1){
        const seen = progress._seen[id] || (progress._seen[id] = []);
        const cid = String(context.id || "");
        if (cid && !seen.includes(cid)) seen.push(cid);
        if (seen.length < need) continue;
      }
      progress._done[id] = true;
      hit.push(t);
    }
    saveProgress(progress);
    if (!hit.length) return;

    const jobs = [];
    window.__lastStars = window.__lastStars || {};
    for (const t of hit){
      const owners = STAMPS.filter(s => stampActive(s) && s.tasks.some(x => key(x) === key(t.row.TASK_ID)));
      const label = t.row.LABEL || "Task complete!";
      if (!owners.length){
        jobs.push({ stamp: { row: { TITLE: "", VEHICLE: "generic" } }, stars: 0, replay: false, kind: "plain", taskLabel: label });
        continue;
      }
      for (const stamp of owners){
        const sid = String(stamp.row.STAMP_ID).trim();
        const stars = starsFor(stamp.row, countFor(stamp));
        const prev = Number(window.__lastStars[sid] || 0);
        if (stars > prev){
          jobs.push({ stamp, stars, replay: false, kind: "star" });
          window.__lastStars[sid] = stars;
        } else {
          jobs.push({ stamp, stars, replay: false, kind: "plain", taskLabel: label });
        }
      }
    }
    try { localStorage.setItem(LAST_STARS_KEY, JSON.stringify(window.__lastStars)); } catch {}
    if (!wasAllRanksComplete && allRanksComplete()){
      jobs.push({ stamp: { row: { TITLE: "MASTER HISTORIAN", VEHICLE: "train", GRAND_RANK: "" } }, stars: 3, replay: false, kind: "grand" });
    }
    enqueueRewards(jobs);
    renderStampCards();
  };

  function nudgeWhenReady(){
    if (document.getElementById("welcomeOverlay")) { setTimeout(nudgeWhenReady, 2000); return; }
    if (!localStorage.getItem(STAMP_KEY)) $("passportBtn").classList.add("nudge");
  }
  setTimeout(nudgeWhenReady, 8000);
})();

const AERIAL = {
  usgs: {
    tiles: ["https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}"],
    maxzoom: 16,
    attribution: "Imagery: USGS The National Map / USDA NAIP"
  },
  indiana: {
    tiles: ["https://di-ingov.img.arcgis.com/arcgis/rest/services/DynamicWebMercator/Indiana_Current_Imagery/ImageServer/exportImage?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&format=jpgpng&f=image"],
    maxzoom: 20,
    attribution: "Imagery: Indiana Geographic Information Office (IGIO)"
  }
};
const inIndiana = c => c.lng > -88.1 && c.lng < -84.78 && c.lat > 37.77 && c.lat < 41.77;
function setAerial(on){
  try {
    if (on && !map.getSource("usgs-tiles")) {
      const order = map.getStyle().layers.map(l => l.id);
      const beforeId = order[order.indexOf("osm") + 1];
      map.addSource("usgs-tiles", { type: "raster", tiles: AERIAL.usgs.tiles, tileSize: 256, maxzoom: AERIAL.usgs.maxzoom, attribution: AERIAL.usgs.attribution });
      map.addLayer({ id: "aerial-usgs", type: "raster", source: "usgs-tiles" }, beforeId);
      if (inIndiana(map.getCenter())) {
        map.addSource("indiana-tiles", { type: "raster", tiles: AERIAL.indiana.tiles, tileSize: 256, maxzoom: AERIAL.indiana.maxzoom, attribution: AERIAL.indiana.attribution });
        map.addLayer({ id: "aerial-indiana", type: "raster", source: "indiana-tiles", minzoom: 13 }, beforeId);
      }
    }
    ["aerial-usgs", "aerial-indiana"].forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", on ? "visible" : "none"); });
    map.setLayoutProperty("osm", "visibility", on ? "none" : "visible");
    $("aerialBtn").setAttribute("aria-pressed", on ? "true" : "false");
    updateMoreDot();
  } catch (e) { console.warn("Aerial view is not ready yet", e); }
}
$("aerialBtn").onclick = () => setAerial($("aerialBtn").getAttribute("aria-pressed") !== "true");

      d.className = "ann-item";
      d.style.setProperty("--c", a.color);
      const tag = document.createElement("span");
      tag.className = "ann-tag";
      tag.textContent = a.tag;
      tag.style.background = a.color;
      tag.style.color = Announcements.readable(a.color);
      const t = document.createElement("b");
      t.textContent = a.name;
      const s = document.createElement("small");
      s.textContent = a.meta;
      d.append(tag, t, s);
      if (a.blurb) { const p = document.createElement("p"); p.textContent = a.blurb; d.appendChild(p); }
      startBtn(d, a.tourId);
      box.appendChild(d);
    });
  }
}
function renderEventSwitcher(){
  const box = $("ev-switch");
  box.innerHTML = "";
  renderWhatsOn(box);
  const list = EVENTS_INDEX.filter(e => e.public !== false);
  if (!list.length) return;
  const h = document.createElement("h3");
  h.textContent = "Events";
  box.appendChild(h);
  const add = (parent, label, lines, href, current, live) => {
    const a = document.createElement("a");
    a.className = "ev-link" + (current ? " cur" : "") + (live ? " now" : "");
    a.href = href;
    if (current) a.setAttribute("aria-current", "page");
    const t = document.createElement("span");
    t.textContent = label;
    a.appendChild(t);
    lines.filter(Boolean).forEach(x => { const s = document.createElement("small"); s.textContent = x.text; if (x.live) s.className = "ev-nowtag"; a.appendChild(s); });
    parent.appendChild(a);
  };
  add(box, "Main map", [], location.pathname + "?event=main", !EVENT_SLUG, false);
  const rank = { now: 0, soon: 1, later: 2, none: 3, ended: 4 };
  const rows = list.map(ev => ({ ev, st: evStatus(ev) || { state: "none" } }))
    .sort((a, b) => (rank[a.st.state] - rank[b.st.state]) || ((a.st.start || 0) - (b.st.start || 0)) || String(a.ev.name).localeCompare(String(b.ev.name)));
  const line = r => [r.st.state !== "none" && { text: (r.st.state === "now" ? "\u25CF " : "") + EventSchedule.statusText(r.st), live: r.st.state === "now" }, r.ev.note && { text: r.ev.note }];
  const link = r => location.pathname + "?event=" + encodeURIComponent(r.ev.slug);
  rows.filter(r => r.st.state !== "ended").forEach(r => add(box, r.ev.name || r.ev.slug, line(r), link(r), r.ev.slug === EVENT_SLUG, r.st.state === "now"));
  const past = rows.filter(r => r.st.state === "ended");
  if (past.length) {
    const det = document.createElement("details");
    det.innerHTML = "<summary>Past events</summary>";
    box.appendChild(det);
    past.forEach(r => add(det, r.ev.name || r.ev.slug, line(r), link(r), r.ev.slug === EVENT_SLUG, false));
  }
}
function refreshEventButton(){
  const own = !!(SITE.event.title || SITE.event.text);
  const pub = EVENTS_INDEX.filter(e => e.public !== false);
  const notices = ANN_ALL.filter(a => a.kind === "announcement");
  const things = window.ETSTours ? ETSTours.featured() : [];
  if (!own && !pub.length && !notices.length && !things.length) return;
  const liveNow = pub.some(e => { const s = evStatus(e); return s && s.state === "now" && e.slug !== EVENT_SLUG; }) || ANN.some(a => a.kind === "announcement" && a.st.state === "now");
  $("eventBtn").textContent = liveNow ? Labels.t("events.nowButton") : (own ? SITE.event.button : "Events");
  $("eventBtn").classList.toggle("now", liveNow);
  $("eventBtn").hidden = false;
}
function openEventPanel(){
  $("ev-title").textContent = SITE.event.title;
  $("ev-title").hidden = !SITE.event.title;
  $("ev-text").textContent = SITE.event.text;
  $("ev-text").hidden = !SITE.event.text;
  renderEventSwitcher();
  $("eventBox").hidden = false;
  $("ev-x").focus();
}
function closeEventPanel(){
  if ($("eventBox").hidden) return;
  $("eventBox").hidden = true;
  $("eventBtn").focus();
}
$("eventBtn").onclick = openEventPanel;
$("ev-x").onclick = closeEventPanel;
$("eventBox").addEventListener("click", e => { if (e.target === $("eventBox")) closeEventPanel(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeEventPanel(); });

/* ============================================================
   POST-LOAD ENHANCEMENTS
   - Mobile half-sheet panel
   - Category filter chips
   - Deep-linking & share
   - Offline cache
   - Prize progress (uses prizes.csv)
   ============================================================ */
(function(){

const $id = id => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isPhone = () => matchMedia("(max-width: 699px)").matches;

function toast(msg, ms){
  const t = $id("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), ms || 2200);
}
window.toast = toast;

/* ------------------------------------------------------------
   CHUNK 1 — HALF-SHEET PANEL (mobile drag)
   ------------------------------------------------------------ */
{
  const panel = $id("panel");
  if (panel) {
    const grab = document.createElement("div");
    grab.className = "grab";
    grab.setAttribute("aria-hidden", "true");
    panel.prepend(grab);
    panel.classList.add("grabber");

    let dragStartY = 0, dragStartT = 0, dragging = false, panelHeight = 0;

    function snapClass(){
      if (!isPhone()) return;
      panel.classList.remove("snap-half","snap-full","snap-closed");
      panel.style.transform = "";
    }
    function setSnap(which){
      if (!isPhone()) return;
      panel.classList.remove("snap-half","snap-full","snap-closed");
      panel.classList.add("snap-" + which);
      if (which === "half" && window.__sel) {
        window.map && window.map.easeTo({
          center: window.__sel.ll,
          padding: { bottom: Math.round(window.innerHeight * 0.42) },
          duration: reduceMotion ? 0 : 300
        });
      }
    }

    new MutationObserver(() => {
      if (panel.hidden) return;
      if (isPhone()){
        panel.classList.remove("snap-full","snap-closed");
        panel.classList.add("snap-half");
      } else {
        panel.classList.remove("snap-half","snap-full","snap-closed");
        panel.style.transform = "";
      }
    }).observe(panel, { attributes:true, attributeFilter:["hidden"] });

    function pointerDown(e){
      if (!isPhone()) return;
      dragging = true;
      dragStartY = e.touches ? e.touches[0].clientY : e.clientY;
      dragStartT = panel.getBoundingClientRect().top;
      panelHeight = panel.getBoundingClientRect().height;
      panel.classList.add("dragging");
      e.preventDefault();
    }
    function pointerMove(e){
      if (!dragging) return;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      const dy = y - dragStartY;
      const newTop = Math.max(0, Math.min(dragStartT + dy, panelHeight - 60));
      panel.style.transform = "translateY(" + newTop + "px)";
    }
    function pointerUp(){
      if (!dragging) return;
      dragging = false;
      panel.classList.remove("dragging");
      const top = panel.getBoundingClientRect().top;
      const h = window.innerHeight;
      if (top < h * 0.35) setSnap("full");
      else if (top > h * 0.85) setSnap("closed");
      else setSnap("half");
    }

    grab.addEventListener("pointerdown", pointerDown);
    panel.addEventListener("pointerdown", e => {
      if (e.target === grab || e.target.classList.contains("grab")) pointerDown(e);
    });
    window.addEventListener("pointermove", pointerMove, { passive:false });
    window.addEventListener("pointerup", pointerUp);
    window.addEventListener("pointercancel", pointerUp);
    window.addEventListener("resize", snapClass);
  }
}

/* ------------------------------------------------------------
   CHUNK 4 — CATEGORY FILTER CHIPS
   ------------------------------------------------------------ */
const HIDDEN_CATS_KEY = "ets_hidden_cats" + (window.KEY_SUFFIX || "");
let hiddenCats = new Set();
try { hiddenCats = new Set(JSON.parse(localStorage.getItem(HIDDEN_CATS_KEY)) || []); } catch {}

function catVisible(code){
  return !hiddenCats.has(String(code || "").trim().toUpperCase());
}
window.catVisible = catVisible;

function buildChips(){
  const wrap = $id("catChipsWrap");
  const ul = $id("catChips");
  if (!wrap || !ul) return;
  if (!window.SITE || !SITE.catNames || !Object.keys(SITE.catNames).length) return;

  const counts = {};
  (window.places || []).concat(window.kids || []).forEach(p => {
    const c = String((p.d && p.d.CATEGORY) || "").trim().toUpperCase();
    if (c) counts[c] = (counts[c] || 0) + 1;
  });

  const codes = Object.keys(SITE.catNames).filter(c => counts[c]);
  if (!codes.length){ wrap.hidden = true; if (typeof syncMoreBtn === "function") syncMoreBtn(); return; }
  wrap.hidden = false;
  if (typeof syncMoreBtn === "function") syncMoreBtn();

  ul.innerHTML = codes.map(code => {
    const on = catVisible(code);
    const color = (SITE.colors && SITE.colors[code]) || "#E47303";
    return `<li><button type="button" data-cat="${code}" aria-pressed="${on}">
      <span class="swatch" style="--sw:${color};background:${color}"></span>
      ${esc(SITE.catNames[code] || code)}
    </button></li>`;
  }).join("") +
  (hiddenCats.size ? `<li><button type="button" class="reset" id="catReset">Reset</button></li>` : "");

  ul.onclick = e => {
    const b = e.target.closest("button[data-cat]");
    if (b){
      const code = b.dataset.cat;
      if (hiddenCats.has(code)) hiddenCats.delete(code); else hiddenCats.add(code);
      try { localStorage.setItem(HIDDEN_CATS_KEY, JSON.stringify([...hiddenCats])); } catch {}
      buildChips();
      window.update && window.update();
      return;
    }
    if (e.target.id === "catReset"){
      hiddenCats.clear();
      try { localStorage.removeItem(HIDDEN_CATS_KEY); } catch {}
      buildChips();
      window.update && window.update();
    }
  };
}
window.__buildChips = buildChips;
setTimeout(buildChips, 3000);


/* ------------------------------------------------------------
   CHUNK 5 — DEEP-LINKING & SHARE
   ------------------------------------------------------------ */
(function(){
  const qs = () => new URLSearchParams(location.search);

  // Remember what was in the URL when the page first loaded.
  // The reader only acts on that original value — writes we make later
  // (as the user browses) do NOT cause a re-select on next render.
  const incomingPlace = qs().get("place");
  const incomingYear  = qs().get("year");
  const incomingCat   = qs().get("cat");
  const hadIncomingSpot = qs().has("spot");
  const hadIncomingSite = qs().has("site");

  try {
    if (incomingYear){
      const yr = $id("yr");
      if (yr){ yr.value = incomingYear; yr.dispatchEvent(new Event("input")); }
    }
    if (incomingCat){
      const on = new Set(incomingCat.split(",").map(s => s.trim().toUpperCase()));
      if (on.size && window.SITE && SITE.catNames){
        Object.keys(SITE.catNames).forEach(code => { if (!on.has(code)) hiddenCats.add(code); });
        try { localStorage.setItem(HIDDEN_CATS_KEY, JSON.stringify([...hiddenCats])); } catch {}
        setTimeout(buildChips, 500);
      }
    }
  } catch(e){}

  // Only auto-select an incoming place if the welcome overlay is NOT up
  // (so we don't fight the intro) and there isn't already a spot/site link.
  if (incomingPlace && !hadIncomingSite && !hadIncomingSpot) {
    const trySelect = () => {
      const welcomeUp = document.getElementById("welcomeOverlay");
      if (welcomeUp) { setTimeout(trySelect, 500); return; }
      const it = (window.places || []).concat(window.kids || [])
        .find(p => String(p.id).trim().toLowerCase() === incomingPlace.trim().toLowerCase());
      if (it && window.select) window.select(it);
    };
    setTimeout(trySelect, 800);
  }

  // Share button on the panel
  const panel = $id("panel");
  if (panel){
    new MutationObserver(() => {
      if (panel.hidden) return;
      if (panel.querySelector(".share-btn")) return;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "share-btn";
      btn.innerHTML = "🔗 Share this place";
      btn.onclick = async () => {
        const id = (window.sel && window.sel.id) || "";
        if (!id) return;
        const url = location.origin + location.pathname + "?place=" + encodeURIComponent(id);
        try {
          if (navigator.share) await navigator.share({ title: document.title, url });
          else { await navigator.clipboard.writeText(url); toast("Link copied"); }
        } catch(e){ prompt("Copy this link:", url); }
      };
      const kids = panel.querySelector("h3");
      if (kids) panel.insertBefore(btn, kids);
      else panel.appendChild(btn);
    }).observe(panel, { childList:true, subtree:true });
  }

  // Update the URL as the user browses — but only AFTER the welcome is gone,
  // and never touch the URL while the welcome is still up.
  const origSelect = window.select;
  if (typeof origSelect === "function" && !window.__selectPatched){
    window.__selectPatched = true;
    window.select = function(it){
      window.__sel = it;
      origSelect.apply(this, arguments);
      if (!it) return;
      if (document.getElementById("welcomeOverlay")) return;   // don't write during intro
      try {
        const q = qs();
        q.set("place", it.id);
        q.delete("spot"); q.delete("site");
        history.replaceState(null, "", location.pathname + "?" + q.toString());
      } catch(e){}
    };
  }
})();

/* ------------------------------------------------------------
   CHUNK 6 — OFFLINE CACHE
   ------------------------------------------------------------ */
(function(){
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").then(reg => {
    console.info("Offline worker registered", reg.scope);
  }).catch(err => { console.warn("Service worker registration failed", err); });

  const body = document.querySelector(".passport-body");
  if (!body) return;
  const btn = document.createElement("button");
  btn.id = "offlineBtn";
  btn.type = "button";
  btn.textContent = "📥 Save this map for offline use";
  body.insertBefore(btn, body.firstChild);

  btn.onclick = async () => {
    if (!navigator.serviceWorker.controller){
      toast("Reload the page once, then try again.");
      return;
    }
    btn.disabled = true;
    btn.textContent = "Saving… 0%";
    const files = [location.pathname].concat(
      window.ETS_CONFIG ? ETS_CONFIG.DATA.concat(ETS_CONFIG.GLOBAL) : ["site.csv", "locations.csv", "childmarkers.csv", "categories.csv", "shapes.csv", "photos.csv", "stamps.csv", "tasks.csv", "prizes.csv", "overlays.json", "spots.csv", "tours.csv", "tourstops.csv", "lines.geojson", "border.geojson"],
      ["events/index.json", window.EVENT_DIR ? window.EVENT_DIR + "event.json" : null]
    ).filter(Boolean);
    navigator.serviceWorker.controller.postMessage({
      type: "PRECACHE", files,
      bounds: window.SITE && SITE.maxBounds,
      zoom: 15
    });
    toast("Saving in the background — you can keep browsing.");
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = "✅ Saved for offline use";
      btn.classList.add("saved");
    }, 4000);
  };
})();

/* ------------------------------------------------------------
   CHUNK 7 — PRIZES (reads prizes.csv, respects PRIZES in site.csv)
   A prize is earned when the visitor reaches the required star in
   every listed stamp. REQUIREMENTS is "STAMP_ID:stars" joined by |
   where stars is "any" | 1 | 2 | 3.
   ------------------------------------------------------------ */
(function(){
  if (!window.SITE) return;

  const PRIZES_READY = (async () => {
    await (window.SETTINGS_READY || Promise.resolve());
    if (SITE.prizes === false) return [];
    try {
      const r = await dataFetch("prizes.csv", { cache:"no-store" });
      if (!r.ok) return [];
      const txt = await r.text();
      if (!txt.trim()) return [];
      return Papa.parse(txt, { header:true, skipEmptyLines:"greedy" }).data
        .filter(r => String(r.PRIZE_ID || "").trim())
        .map(r => ({
          id: String(r.PRIZE_ID).trim(),
          label: String(r.LABEL || r.PRIZE_ID).trim(),
          reward: String(r.REWARD || "").trim(),
          code: String(r.CODE || "").trim(),
          order: parseInt(r.ORDER, 10) || 9999,
          reqs: parseRequirements(r.REQUIREMENTS)
        }))
        .sort((a, b) => a.order - b.order);
    } catch (e) { return []; }
  })();

  function parseRequirements(s){
    return String(s || "").split("|").map(x => x.trim()).filter(Boolean).map(x => {
      const parts = x.split(":");
      const stamp = String(parts[0] || "").trim();
      let stars = String(parts[1] || "any").trim().toLowerCase();
      if (stars === "") stars = "any";
      if (stars !== "any" && !["1","2","3"].includes(stars)) stars = "any";
      return { stamp, stars };
    }).filter(r => r.stamp);
  }

  function starsInStamp(stampId){
    try {
      const list = window.__stampsData || [];
      const stamp = list.find(s => String(s.row.STAMP_ID).trim().toLowerCase() === stampId.toLowerCase());
      if (!stamp) return 0;
      const KEY = "ets_stamps_v2" + (window.KEY_SUFFIX || "");
      const progress = JSON.parse(localStorage.getItem(KEY)) || {};
      const done = progress._done || {};
      const bucket = progress[String(stamp.row.STAMP_ID).trim()] || {};
      const count = stamp.tasks.filter(id => done[id] || bucket[id]).length;
      const t1 = +stamp.row.STAR1 || Infinity;
      const t2 = +stamp.row.STAR2 || Infinity;
      const t3 = +stamp.row.STAR3 || Infinity;
      if (count >= t3) return 3;
      if (count >= t2) return 2;
      if (count >= t1) return 1;
      return 0;
    } catch (e) { return 0; }
  }

  function reqMet(req){
    const have = starsInStamp(req.stamp);
    if (req.stars === "any") return have >= 1;
    return have >= (+req.stars || 1);
  }

  function prizeProgress(prize){
    const total = prize.reqs.length;
    const met = prize.reqs.filter(reqMet).length;
    return { total, met, done: total > 0 && met >= total };
  }

  function renderPrizes(prizes){
    const body = document.querySelector(".passport-body");
    if (!body || !prizes.length) return;
    let box = document.getElementById("pPrizes");
    if (!box){
      box = document.createElement("section");
      box.id = "pPrizes";
      const grid = document.getElementById("stampGrid");
      if (grid) grid.parentNode.insertBefore(box, grid);
      else body.appendChild(box);
    }
    box.innerHTML = `<h3 class="p-h">Prizes</h3>` + prizes.map(p => {
      const { total, met, done } = prizeProgress(p);
      const pct = total ? Math.round(met / total * 100) : 0;
      return `<div class="p-prize ${done ? "done" : ""}" data-prize="${esc(p.id)}">
        <h4>${esc(p.label)}</h4>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="meta">${done ? "🎉 " + esc(p.reward || "You did it!") : met + " of " + total + " — " + esc(p.reward || "keep going!")}</div>
        ${done ? `<button type="button" class="p-claim" data-claim="${esc(p.id)}">Show this to claim</button>` : ""}
      </div>`;
    }).join("");

    box.querySelectorAll(".p-claim").forEach(btn => {
      btn.onclick = () => {
        const p = prizes.find(x => x.id === btn.dataset.claim);
        if (p) showClaimSlip(p);
      };
    });
  }

  function showClaimSlip(prize){
    let slip = document.getElementById("claimSlip");
    if (!slip){
      slip = document.createElement("div");
      slip.id = "claimSlip";
      slip.innerHTML = `<div class="slip">
        <button class="x" type="button" aria-label="Close">&times;</button>
        <h2 id="slipTitle"></h2>
        <p id="slipReward"></p>
        <div id="slipCode" hidden><span>Claim code</span><b id="slipCodeVal"></b></div>
        <p class="small">Show this screen to the vendor.</p>
      </div>`;
      document.body.appendChild(slip);
      slip.querySelector(".x").onclick = () => slip.classList.remove("on");
      slip.addEventListener("click", e => { if (e.target === slip) slip.classList.remove("on"); });
      document.addEventListener("keydown", e => { if (e.key === "Escape") slip.classList.remove("on"); });
    }
    slip.querySelector("#slipTitle").textContent = prize.label;
    slip.querySelector("#slipReward").textContent = prize.reward || "You've earned this prize!";
    const cbox = slip.querySelector("#slipCode");
    if (prize.code){ slip.querySelector("#slipCodeVal").textContent = prize.code; cbox.hidden = false; }
    else cbox.hidden = true;
    slip.classList.add("on");
  }

  PRIZES_READY.then(prizes => {
    if (!prizes.length) return;
    window.__prizes = prizes;
    renderPrizes(prizes);

    const drawer = document.getElementById("passportDrawer");
    if (drawer){
      new MutationObserver(() => {
        if (drawer.classList.contains("open")) renderPrizes(prizes);
      }).observe(drawer, { attributes: true, attributeFilter: ["class"] });
    }
  });
})();

})();
